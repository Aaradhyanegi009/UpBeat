name: Build UpBeat Windows Desktop

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Release tag to attach Windows binaries to (default: v7.3.1)'
        required: false
        default: 'v7.3.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout UpBeat Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend Assets
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Electron Desktop Dependencies
        working-directory: electron
        run: |
          npm install

      - name: Package Windows Desktop App (NSIS Installer & Portable ZIP)
        working-directory: electron
        run: |
          npm run dist:win

      - name: Standardize Artifact Names
        shell: pwsh
        run: |
          $dist = "electron/dist-win"
          $setupExe = Get-ChildItem "$dist/*.exe" | Where-Object { $_.Name -match "(?i)setup" } | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "$dist/UpBeat-Windows-Setup.exe" -Force
            Write-Host "Created $dist/UpBeat-Windows-Setup.exe"
          } else {
            $anyExe = Get-ChildItem "$dist/*.exe" | Select-Object -First 1
            if ($anyExe) {
              Copy-Item $anyExe.FullName "$dist/UpBeat-Windows-Setup.exe" -Force
              Write-Host "Created $dist/UpBeat-Windows-Setup.exe from $($anyExe.Name)"
            }
          }

          $zipFile = Get-ChildItem "$dist/*.zip" | Select-Object -First 1
          if ($zipFile) {
            Copy-Item $zipFile.FullName "$dist/UpBeat-Windows.zip" -Force
            Write-Host "Created $dist/UpBeat-Windows.zip"
          }

          Get-ChildItem "$dist" | Select-Object Name, Length

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpBeat-Windows-Setup
          path: electron/dist-win/UpBeat-Windows-Setup.exe
          if-no-files-found: error

      - name: Upload Windows Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpBeat-Windows-Portable-ZIP
          path: electron/dist-win/UpBeat-Windows.zip
          if-no-files-found: error

      - name: Publish Windows App to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.target_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v7.3.1' }}
          files: |
            electron/dist-win/UpBeat-Windows-Setup.exe
            electron/dist-win/UpBeat-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
