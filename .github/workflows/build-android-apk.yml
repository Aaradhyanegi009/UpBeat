name: Build UpBeat Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UpBeat Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Frontend & Sync Capacitor Android
        working-directory: frontend
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/UpBeat.apk

      - name: Upload UpBeat-Android-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpBeat-Android-APK
          path: android/app/build/outputs/apk/debug/UpBeat.apk

      - name: Package macOS App Bundle & OTA Live Update Bundle
        run: |
          if [ -d "UpBeat.app" ]; then
            zip -r -y UpBeat-macOS.zip UpBeat.app
          fi
          if [ -d "frontend/dist" ]; then
            cd frontend/dist
            zip -r ../../dist.zip .
            cd ../..
            sha256sum dist.zip | awk '{print $1}' > dist.zip.sha256
          fi

      - name: Publish UpBeat.apk and macOS Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v5.1.0' }}
          name: ${{ github.ref_type == 'tag' && format('UpBeat {0}', github.ref_name) || 'UpBeat v5.1.0 — Queue UI/UX & Synced Lyrics' }}
          files: |
            android/app/build/outputs/apk/debug/UpBeat.apk
            UpBeat-macOS.zip
            dist.zip
            dist.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
